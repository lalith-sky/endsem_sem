services:
  # Backend Service
  - type: web
    name: portfolio-backend
    runtime: java
    buildCommand: cd backend && mvn clean install -DskipTests
    startCommand: cd backend && java -jar target/portfolio-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_OPTS
        value: -Xmx512m
      - key: SERVER_PORT
        value: 8080
    healthCheckPath: /api/health

  # Frontend Service
  - type: web
    name: portfolio-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: NODE_VERSION
        value: 18
